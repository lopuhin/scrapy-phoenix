[project]
name = "scrapy-phoenix"
version = "0.0.1"
description = "Prototype: a Scrapy spider that notices site drift and repairs itself mid-crawl"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.19",
    "web-poet>=0.24",
    "zyte-common-items>=0.29",
]

[project.optional-dependencies]
agent = ["harness-run[local] @ git+https://github.com/zytedata/harness-run.git@4028849faf48ac448b1634140cfe3a9cac8f2749"]
test = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["selfheal*", "sandbox_spider*", "sandbox_modern*", "sandbox_scroll*", "books_spider*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "sandbox_spider/fixtures", "sandbox_modern/fixtures", "sandbox_scroll/fixtures", "books_spider/fixtures"]
