<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #f8f9fa; }
        h1 { color: #dc3545; font-size: 3rem; }
        p { font-size: 1.2rem; color: #555; }
        .error-code { font-size: 5rem; font-weight: bold; color: #333; margin: 0; }
    </style>
</head>
<body>
    <div class="error-code">{{ status_code }}</div>
    <h1>Access Denied</h1>
    <p>Your request has been blocked due to suspicious activity.</p>
    <p>Please contact support if you believe this is an error.</p>
</body>
</html>
