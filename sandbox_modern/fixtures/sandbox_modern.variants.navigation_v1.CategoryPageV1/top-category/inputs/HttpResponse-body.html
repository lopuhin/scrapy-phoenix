<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics - Modern Store</title>
    <style>
        :root { --bg: #222; --text: #eee; --accent: #00d2ff; --secondary: #333; }
        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar Navigation */
        aside.sidebar { width: 250px; background: var(--secondary); padding: 2rem; display: flex; flex-direction: column; }
        aside.sidebar h1 { font-size: 1.2rem; margin-bottom: 2rem; color: var(--accent); }
        aside.sidebar nav a { display: block; padding: 10px 0; color: #aaa; text-decoration: none; border-bottom: 1px solid #444; }
        aside.sidebar nav a:hover { color: #fff; padding-left: 5px; transition: 0.3s; }

        /* Main Content */
        main.content-wrapper { flex: 1; padding: 3rem; overflow-y: auto; }

        /* Links */
        a { color: var(--accent); text-decoration: none; }

        /* Footer */
        footer.site-footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #444; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1>MODERN STORE</h1>
        <nav>
            <a href="/sandbox-store/">Dashboard</a>
            <a href="#">Settings</a>
            <a href="#">Profile</a>
        </nav>
    </aside>

    <main class="content-wrapper">
        
<div class="nav-path" style="margin-bottom: 2rem; color: #888;">
    <a href="/sandbox-store/">Dashboard</a> /
    
    <span style="color: #eee;">Electronics</span>
</div>

<h1 style="border-bottom: 2px solid #444; padding-bottom: 1rem;">Electronics</h1>

<!-- Subcats as tags -->

<div class="tags-cloud" style="margin-bottom: 2rem;">
    
    <a href="/sandbox-store/category/cat_0_sub_0" style="display: inline-block; background: #444; color: #fff; padding: 5px 15px; border-radius: 4px; margin-right: 10px; font-size: 0.9rem;">Smartphones</a>
    
    <a href="/sandbox-store/category/cat_0_sub_1" style="display: inline-block; background: #444; color: #fff; padding: 5px 15px; border-radius: 4px; margin-right: 10px; font-size: 0.9rem;">Laptops</a>
    
    <a href="/sandbox-store/category/cat_0_sub_2" style="display: inline-block; background: #444; color: #fff; padding: 5px 15px; border-radius: 4px; margin-right: 10px; font-size: 0.9rem;">Headphones</a>
    
    <a href="/sandbox-store/category/cat_0_sub_3" style="display: inline-block; background: #444; color: #fff; padding: 5px 15px; border-radius: 4px; margin-right: 10px; font-size: 0.9rem;">Cameras</a>
    
    <a href="/sandbox-store/category/cat_0_sub_4" style="display: inline-block; background: #444; color: #fff; padding: 5px 15px; border-radius: 4px; margin-right: 10px; font-size: 0.9rem;">Smart Watches</a>
    
</div>


<!-- Different structure: Table layout for products -->
<div class="inventory-table">
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="text-align: left; color: #888;">
                <th style="padding: 1rem;">Item</th>
                <th style="padding: 1rem;">Preview</th>
                <th style="padding: 1rem;">Cost</th>
                <th style="padding: 1rem;">Action</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
</div>

<!-- Pagination as a slider-like control -->
<div class="control-panel" style="margin-top: 3rem; display: flex; justify-content: center; align-items: center; gap: 1rem;">
    

    <span style="font-family: monospace;">PAGE 1 / 0</span>

    
</div>


        <footer class="site-footer">
            System Status: Operational | 2026
        </footer>
    </main>
</body>
</html>
