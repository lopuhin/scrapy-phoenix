<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Modern Store</title>
    <style>
        :root { --bg: #222; --text: #eee; --accent: #00d2ff; --secondary: #333; }
        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Sidebar Navigation */
        aside.sidebar { width: 250px; background: var(--secondary); padding: 2rem; display: flex; flex-direction: column; }
        aside.sidebar h1 { font-size: 1.2rem; margin-bottom: 2rem; color: var(--accent); }
        aside.sidebar nav a { display: block; padding: 10px 0; color: #aaa; text-decoration: none; border-bottom: 1px solid #444; }
        aside.sidebar nav a:hover { color: #fff; padding-left: 5px; transition: 0.3s; }

        /* Main Content */
        main.content-wrapper { flex: 1; padding: 3rem; overflow-y: auto; }

        /* Links */
        a { color: var(--accent); text-decoration: none; }

        /* Footer */
        footer.site-footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #444; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1>MODERN STORE</h1>
        <nav>
            <a href="/sandbox-store/">Dashboard</a>
            <a href="#">Settings</a>
            <a href="#">Profile</a>
        </nav>
    </aside>

    <main class="content-wrapper">
        
<div class="dashboard-header">
    <h2>Category Overview</h2>
</div>

<div class="category-stream" style="display: flex; flex-direction: column; gap: 1rem;">
    
    <div class="stream-item" style="background: #333; padding: 1.5rem; border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h3 style="margin: 0;">Electronics</h3>
            <span style="font-size: 0.8rem; color: #888;">ID: cat_0</span>
        </div>
        <a href="/sandbox-store/category/cat_0" class="btn-explore" style="background: #444; padding: 0.5rem 1rem; border-radius: 20px;">Explore &rarr;</a>
    </div>
    
    <div class="stream-item" style="background: #333; padding: 1.5rem; border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h3 style="margin: 0;">Clothing</h3>
            <span style="font-size: 0.8rem; color: #888;">ID: cat_1</span>
        </div>
        <a href="/sandbox-store/category/cat_1" class="btn-explore" style="background: #444; padding: 0.5rem 1rem; border-radius: 20px;">Explore &rarr;</a>
    </div>
    
    <div class="stream-item" style="background: #333; padding: 1.5rem; border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h3 style="margin: 0;">Home &amp; Garden</h3>
            <span style="font-size: 0.8rem; color: #888;">ID: cat_2</span>
        </div>
        <a href="/sandbox-store/category/cat_2" class="btn-explore" style="background: #444; padding: 0.5rem 1rem; border-radius: 20px;">Explore &rarr;</a>
    </div>
    
    <div class="stream-item" style="background: #333; padding: 1.5rem; border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h3 style="margin: 0;">Books</h3>
            <span style="font-size: 0.8rem; color: #888;">ID: cat_3</span>
        </div>
        <a href="/sandbox-store/category/cat_3" class="btn-explore" style="background: #444; padding: 0.5rem 1rem; border-radius: 20px;">Explore &rarr;</a>
    </div>
    
</div>


        <footer class="site-footer">
            System Status: Operational | 2026
        </footer>
    </main>
</body>
</html>
